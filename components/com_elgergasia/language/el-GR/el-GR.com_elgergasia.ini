COM_ELGERGASIA_INTRO_JOBS="Πολλές από τις θέσεις εργασίας που έχουμε, τις αναρτούμε στον ιστότοπό μας από όπου μπορείτε να τις αναζητήσετε. Οι πιο συνήθεις αναρτήσεις για δουλειές αφορούν #1, #2 και γενικότερα #3  όπου υπάρχει προσφορά όλο τον χρόνο. Ανάλογα με την εποχικότητα όμως υπάρχουν και διαθέσιμες θέσεις εργασίας σε τουριστικά επαγγέλματα και εστιατόρια. Ειδικότερα στις αρχές κάθε σεζόν, είτε καλοκαιρίνη ή χειμωνιάτικη καθώς επίσης Χριστουγέννα και Πάσχα, πάντα υπάρχει ζήτηση για #4, #5 και #6 και άλλες ειδικότητες γύρω από τον χώρου του τουρισμού και τις εστίασης. Έίναι συμφέρον για κάθε εργαζόμενο να ψάχνει αγγελίες λίγο πριν την αρχή κάθε σεζόν, τότε που ξενοδόχοι, εστιάτορες κλπ ψάχνουν προσωπικό."   
